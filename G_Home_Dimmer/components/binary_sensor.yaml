binary_sensor:
  - platform: gpio
    pin:
      number: P9
      inverted: true
    name: "Physical Button"
    on_press:
      then:
        - lambda: |-
            id(button_state) = !id(button_state);
            if (id(button_state)) {
              uint8_t bar = 0x40 | 7;
              id(uart_bus).write_array(&bar, 1);
              id(green_led).turn_on();
            } else {
              id(green_led).turn_off();
            }