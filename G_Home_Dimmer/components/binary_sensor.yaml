binary_sensor:
  - platform: gpio
    id: push_button
    name: "Physical Button (Offline)"
    internal: true
    pin:
      number: P9
      inverted: true
    on_press:
      then:
        - lambda: |-
            id(button_state) = !id(button_state);
            if (id(button_state)) {
              id(switch_light).turn_on().perform();
            } else {
              id(switch_light).turn_off().perform();
            }