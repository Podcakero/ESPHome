number:
  - platform: template
    name: "Dimmer Level"
    id: dimmer_slider
    icon: mdi:lightbulb
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 100
    step: 1
    set_action:
      then:
        - lambda: |-
            int bar_level = int((x / 100.0f) * 6.0f + 1.0f + 0.5f);
            if (bar_level < 1) bar_level = 1;
            if (bar_level > 7) bar_level = 7;
            uint8_t bar_cmd = 0x40 | bar_level;
            id(uart_bus).write_array(&bar_cmd, 1);