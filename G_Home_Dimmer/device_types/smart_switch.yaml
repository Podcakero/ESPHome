substitutions:
  device_type: smart_switch

esphome:
  on_boot:
    priority: -100
    then:
      - lambda: |-
          float v = id(dimmer_slider).state;

          auto call = id(switch_light)->make_call();
          if (v <= 0.05f) {
            call.set_state(false);
          } else {
            call.set_brightness(v);
            call.set_state(true);
          }
          call.perform();
  includes:
    - ../../../custom_components/ghomedimmer_uart_slider.h

bk72xx:
  board: generic-bk7231t-qfn32-tuya