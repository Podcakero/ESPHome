light:
  - platform: color_temp_rgbw_light
    id: bulb
    name: ${node_name}
    icon: ${icon}

    # These bulbs stop dimming (and stop lighting up) below 15% of the slider,
    # so map HA 0% onto that minimum: the full 0-100% slider now spans the range
    # the bulbs can actually produce, without a flat dead zone at the bottom.
    min_brightness: 15%

    # Restore last known state (power/brightness/color) on reboot.
    # If no state is stored yet, default to ON.
    restore_mode: RESTORE_AND_ON

    # Optional: make the "snap to on" immediate.
    default_transition_length: 0s

    red: output_red
    green: output_green
    blue: output_blue
    white: output_white
