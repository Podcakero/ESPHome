light:
  - platform: custom
    lambda: |-
      auto light_out = new esphome::color_temp_rgbw_light::ColorTempRGBWLight();
      light_out->set_red(id(output_red));
      light_out->set_green(id(output_green));
      light_out->set_blue(id(output_blue));
      light_out->set_white(id(output_white));
      App.register_component(light_out);
      return {light_out};
    lights:
      - id: bulb_light
        name: ${node_name}

        # Restore last known state (power/brightness/color) on reboot.
        # If no state is stored yet, default to ON.
        restore_mode: RESTORE_DEFAULT_ON

        # Whenever the light is turned ON (by HA, button, etc.), set default brightness.
        on_turn_on:
          - light.turn_on:
              id: bulb_light
              brightness: 40%

        # Optional: make the "snap to on" immediate.
        default_transition_length: 0s
