light:
  - platform: custom
    lambda: |-
      auto light_out = new CustomRGBWLight(id(output_red), id(output_green), id(output_blue), id(output_white));
      App.register_component_(light_out);
      return {light_out};
    lights:
      - id: bulb_light
        name: ${node_name}

        # Restore last known state (power/brightness/color) on reboot.
        # If no state is stored yet, default to ON.
        restore_mode: RESTORE_AND_ON

        # Optional: make the "snap to on" immediate.
        default_transition_length: 0s
