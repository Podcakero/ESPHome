output:
  - platform: libretiny_pwm
    id: output_red
    pin: P7
    frequency: 5000 Hz
    # RGB LEDs do not turn on below 25%
    max_power: 100%
    min_power: 25%
    zero_means_zero: true

  - platform: libretiny_pwm
    id: output_green
    pin: P8
    frequency: 5000 Hz
    # RGB LEDs do not turn on below 25%
    max_power: 100%
    min_power: 25%
    zero_means_zero: true

  - platform: libretiny_pwm
    id: output_blue
    pin: P9
    frequency: 5000 Hz
    # RGB LEDs do not turn on below 25%
    max_power: 100%
    min_power: 25%
    zero_means_zero: true

  - platform: libretiny_pwm
    id: output_white
    pin: P24
    frequency: 5000 Hz
    # 100% power overdrives the LEDs, so set max power to 80%
    # White LED does not turn on below 10%
    max_power: 80%
    min_power: 15%
    zero_means_zero: true