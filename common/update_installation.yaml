ota:
  - platform: esphome
    id: esphome_ota
    encryption:
    on_begin:
      then:
        - logger.log: 
            format: "Starting ESPHome OTA Update"
            level: INFO
            tag: ota.esphome
    on_progress:
      then:
        - logger.log: 
            format: "ESPHome OTA Progess %0.1f%%"
            args: ["x"]
            level: INFO
            tag: ota.esphome
    on_end:
      then:
        - logger.log: 
            format: "ESPHome OTA Update Complete"
            level: INFO
            tag: ota.esphome
    on_error:
      then:
        - logger.log:
            format: "ESPHome OTA Update Error %d"
            args: ["x"]
            level: INFO
            tag: ota.esphome

  - platform: web_server
    id: web_server_ota
    on_begin:
      then:
        - logger.log: 
            format: "Starting Web Server OTA Update"
            level: INFO
            tag: ota.web_server
    on_progress:
      then:
        - logger.log: 
            format: "Web Server OTA Progess %0.1f%%"
            args: ["x"]
            level: INFO
            tag: ota.web_server
    on_end:
      then:
        - logger.log: 
            format: "Web Server OTA Update Complete"
            level: INFO
            tag: ota.web_server
    on_error:
      then:
        - logger.log:
            format: "Web Server OTA Update Error %d"
            args: ["x"]
            level: INFO
            tag: ota.web_server